<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        model-viewer { width: 100%; height: 100%; }
        .ar-button-custom {
    position: absolute;
    bottom: 16px;
    right: 16px;

    background: #000;
    color: #fff;

    padding: 10px 16px;
    border-radius: 9999px;

    font-size: 14px;
    font-weight: 600;

    border: none;
    cursor: pointer;

    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
}

.ar-button-custom:hover {
    background: #111;
}

    </style>
</head>

<body class="bg-gray-100 pb-28">
    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="p-4 flex justify-between items-center">
            <a href="index.html" class="text-xl">←</a>
            <img src="images/logo_reteiller.png" alt="Logo" class="h-10 w-auto object-contain">
        </div>
    </header>

    <!-- PRODUCT SECTION -->
    <section class="bg-white h-80 flex items-center justify-center" id="productViewer">
        <!-- Modelo 3D será carregado aqui -->
    </section>

    <!-- PRODUCT INFO -->
    <section class="p-4 space-y-3 bg-gray-100" id="productInfo">
        <!-- Informações serão carregadas aqui -->
    </section>

    <!-- FOOTER CART CTA -->
    <footer class="fixed bottom-16 left-0 right-0 px-4">
        <button id="buyNow" class="w-full bg-black text-white py-4 rounded-2xl font-semibold">
            Buy now
        </button>
    </footer>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-md">
        <div class="flex justify-around py-3 text-xs text-gray-500">
            <a href="index.html" class="flex flex-col items-center">🏠 <span>Home</span></a>
            <a href="cart.html" class="flex flex-col items-center relative">
                🛒 <span>Cart</span>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center">👤 <span>Profile</span></a>
        </div>
    </nav>

    <script src="products.js"></script>
    <script>
        // Obter ID do produto da URL
        function getProductId() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }

        // Encontrar produto pelo ID
        function getProductById(id) {
            return products.find(p => p.id === id);
        }

        // Adicionar ao carrinho
        function addToCart(product, quantity = 1) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // Verificar se produto já está no carrinho
            const existingIndex = cart.findIndex(item => item.id === product.id);
            
            if (existingIndex > -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    ...product,
                    quantity: quantity
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            
            // Feedback visual
            alert('Product added to cart!');
        }

        // Atualizar contador do carrinho
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = document.getElementById('cartCount');
            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.classList.toggle('hidden', cart.length === 0);
        }

        // Renderizar produto
        function renderProduct() {
            const productId = getProductId();
            const product = getProductById(productId);
            
            if (!product) {
                document.body.innerHTML = '<div class="p-8 text-center">Product not found</div>';
                return;
            }
            
            // Atualizar título
            document.title = product.name;
            
            // Renderizar visualizador 3D
            const viewer = document.getElementById('productViewer');
            viewer.innerHTML = `
                <model-viewer
                    src="${product.model}"
                    alt="${product.name}"
                    ar
                    ar-modes="webxr scene-viewer quick-look"
                    camera-controls
                    auto-rotate
                    shadow-intensity="1">

                     <!-- BOTÃO AR CUSTOMIZADO -->
                    <button
                        slot="ar-button"
                        class="ar-button-custom">
                        Virtual try on
                    </button>
                </model-viewer>
            `;
            
            // Renderizar informações
            const info = document.getElementById('productInfo');
            info.innerHTML = `
                <h2 class="text-xl font-semibold">${product.name}</h2>
                <div class="flex items-center justify-between">
                    <p class="text-2xl font-bold text-red-500">${product.price.toFixed(2)} MT</p>
                    <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded-full">In stock</span>
                </div>
                <p class="text-gray-600 text-sm">${product.description}</p>
                <div class="flex gap-3 mt-4">
                    <button id="addToCart" class="flex-1 border border-red-500 text-red-500 rounded-xl py-3 text-sm font-semibold">
                        Add to cart
                    </button>
                    <button id="addToWishlist" class="flex-1 border border-gray-400 rounded-xl py-3 text-sm">
                        ❤️ Wishlist
                    </button>
                </div>
            `;
            
            // Adicionar eventos
            document.getElementById('addToCart').addEventListener('click', () => addToCart(product));
            document.getElementById('buyNow').addEventListener('click', () => {
                addToCart(product);
                window.location.href = 'checkout.html';
            });
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            renderProduct();
        });
    </script>
</body>
</html>
