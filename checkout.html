<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 pb-36">
    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="p-4 flex items-center gap-3">
            <a href="javascript:history.back()" class="text-xl">←</a>
            <img src="images/logo_reteiller.png" class="h-8">
        </div>
    </header>

    <!-- CART ITEMS -->
    <div id="cartItems" class="space-y-3">
        <!-- Itens serão carregados aqui -->
    </div>

    <!-- DELIVERY ADDRESS -->
    <section class="bg-white p-4 mt-3 rounded-xl mx-4 shadow-sm">
        <h2 class="font-semibold mb-3">Delivery address</h2>
        <input type="text" placeholder="Full name" class="w-full border rounded-lg px-3 py-2 mb-2">
        <input type="tel" placeholder="Phone number" class="w-full border rounded-lg px-3 py-2 mb-2">
        <textarea placeholder="Delivery address" class="w-full border rounded-lg px-3 py-2"></textarea>
    </section>

    <!-- PAYMENT METHOD -->
    <section class="bg-white p-4 mt-3 rounded-xl mx-4 shadow-sm">
        <h2 class="font-semibold mb-3">Payment method</h2>
        <label class="flex items-center gap-3 mb-2">
            <input type="radio" name="payment" value="card" checked>
            <span>💳 Card</span>
        </label>
        <label class="flex items-center gap-3 mb-2">
            <input type="radio" name="payment" value="mpesa">
            <span>📱 M-Pesa</span>
        </label>
        <label class="flex items-center gap-3">
            <input type="radio" name="payment" value="cash">
            <span>💵 Cash on delivery</span>
        </label>
    </section>

    <!-- PRICE SUMMARY -->
    <section class="bg-white p-4 mt-3 rounded-xl mx-4 shadow-sm">
        <h2 class="font-semibold mb-3">Payment summary</h2>
        <div class="flex justify-between text-sm mb-1">
            <span>Subtotal</span>
            <span id="subtotal">0.00 MT</span>
        </div>
        <div class="flex justify-between text-sm mb-1">
            <span>Delivery</span>
            <span id="delivery">50.00 MT</span>
        </div>
        <div class="flex justify-between font-semibold text-lg mt-3">
            <span>Total</span>
            <span id="total" class="text-red-500">0.00 MT</span>
        </div>
    </section>

    <!-- CONFIRM BUTTON -->
    <footer class="fixed bottom-16 left-0 right-0 px-4">
        <button id="confirmOrder" class="w-full bg-black text-white py-4 rounded-2xl font-semibold">
            Confirm & Pay
        </button>
    </footer>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-md">
        <div class="flex justify-around py-3 text-xs text-gray-500">
            <a href="index.html" class="flex flex-col items-center">🏠 <span>Home</span></a>
            <a href="cart.html" class="flex flex-col items-center text-black font-semibold">
                🛒 <span>Cart</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center">👤 <span>Profile</span></a>
        </div>
    </nav>

    <script>
        // Carregar carrinho do localStorage
        function loadCart() {
            return JSON.parse(localStorage.getItem('cart')) || [];
        }

        // Salvar carrinho no localStorage
        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // Atualizar quantidade
        function updateQuantity(productId, change) {
            const cart = loadCart();
            const itemIndex = cart.findIndex(item => item.id === productId);
            
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                
                saveCart(cart);
                renderCart();
            }
        }

        // Remover item
        function removeItem(productId) {
            const cart = loadCart().filter(item => item.id !== productId);
            saveCart(cart);
            renderCart();
        }

        // Calcular totais
        function calculateTotals() {
            const cart = loadCart();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const delivery = 50.00;
            const total = subtotal + delivery;
            
            document.getElementById('subtotal').textContent = `${subtotal.toFixed(2)} MT`;
            document.getElementById('delivery').textContent = `${delivery.toFixed(2)} MT`;
            document.getElementById('total').textContent = `${total.toFixed(2)} MT`;
        }

        // Renderizar carrinho
        function renderCart() {
            const cart = loadCart();
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-4 mt-3 rounded-xl mx-4 shadow-sm text-center py-8">
                        <p class="text-gray-500">Your cart is empty</p>
                        <a href="index.html" class="text-red-500 font-semibold mt-2 inline-block">Continue Shopping</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            cart.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.className = 'bg-white p-4 rounded-xl mx-4 shadow-sm';
                itemElement.innerHTML = `
                    <div class="flex gap-4">
                        <img src="${item.image}" class="h-20 w-20 object-contain bg-gray-100 rounded-lg">
                        <div class="flex-1">
                            <p class="font-semibold">${item.name}</p>
                            <p class="text-sm text-gray-500">Size: M</p>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-red-500 font-bold">${(item.price * item.quantity).toFixed(2)} MT</span>
                                <div class="flex items-center gap-2">
                                    <div class="flex items-center border rounded-lg">
                                        <button class="decrease-btn px-3 py-1 text-gray-500" data-id="${item.id}">−</button>
                                        <span class="px-3 text-sm">${item.quantity}</span>
                                        <button class="increase-btn px-3 py-1 text-gray-500" data-id="${item.id}">+</button>
                                    </div>
                                    <button class="remove-btn text-red-500 text-sm" data-id="${item.id}">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(itemElement);
            });
            
            calculateTotals();
            
            // Adicionar eventos
            document.querySelectorAll('.increase-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    updateQuantity(parseInt(e.target.dataset.id), 1);
                });
            });
            
            document.querySelectorAll('.decrease-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    updateQuantity(parseInt(e.target.dataset.id), -1);
                });
            });
            
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm('Remove this item from cart?')) {
                        removeItem(parseInt(e.target.dataset.id));
                    }
                });
            });
        }

        // Finalizar pedido
        function checkout() {
            const cart = loadCart();
            
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            // Simular processamento do pedido
            const order = {
                id: Date.now(),
                items: cart,
                total: parseFloat(document.getElementById('total').textContent),
                date: new Date().toISOString(),
                status: 'pending'
            };
            
            // Salvar histórico de pedidos
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            
            // Limpar carrinho
            localStorage.removeItem('cart');
            
            // Redirecionar para confirmação
            alert('Order placed successfully!');
            window.location.href = 'index.html';
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            
            document.getElementById('confirmOrder').addEventListener('click', checkout);
        });
    </script>
</body>
</html>
