<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clothes Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 pb-24">
    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="images/logo_reteiller.png" alt="Logo" class="h-10 w-auto object-contain">
            </div>
            <button class="text-gray-500 text-xl">📍</button>
        </div>
        
        <div class="px-4 pb-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search products..." class="w-full pl-4 pr-10 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring focus:ring-gray-200">
                <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- FILTERS -->
    <div class="px-4 py-2 flex gap-2 overflow-x-auto">
        <button class="filter-btn px-4 py-2 rounded-full bg-white border text-sm whitespace-nowrap" data-category="all">All</button>
        <button class="filter-btn px-4 py-2 rounded-full bg-white border text-sm whitespace-nowrap" data-category="clothes">Clothes</button>
        <button class="filter-btn px-4 py-2 rounded-full bg-white border text-sm whitespace-nowrap" data-category="shoes">Shoes</button>
    </div>

    <!-- PRODUCTS GRID -->
    <main class="p-4 grid grid-cols-2 gap-4" id="productsGrid"></main>

    <!-- FOOTER -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-md">
        <nav class="flex justify-around py-3 text-xs text-gray-500">
            <a href="index.html" class="flex flex-col items-center text-red-500">
                🏠 <span>Home</span>
            </a>
            <a href="cart.html" class="flex flex-col items-center relative">
                🛒 <span>Cart</span>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center">👤 <span>Profile</span></a>
        </nav>
    </footer>

    <script src="products.js"></script>
    <script>
        // Inicializar carrinho se não existir
        if (!localStorage.getItem('cart')) {
            localStorage.setItem('cart', JSON.stringify([]));
        }

        // Atualizar contador do carrinho
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = document.getElementById('cartCount');
            cartCount.textContent = cart.length;
            cartCount.classList.toggle('hidden', cart.length === 0);
        }

        // Renderizar produtos
        function renderProducts(filteredProducts) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            filteredProducts.forEach(product => {
                const link = document.createElement('a');
                link.href = `product.html?id=${product.id}`;
                link.className = 'bg-white rounded-xl shadow-sm p-3 hover:shadow-md transition-shadow';
                link.innerHTML = `
                    <img src="${product.image}" class="h-32 w-full object-contain mb-2" alt="${product.name}">
                    <h2 class="text-sm font-semibold">${product.name}</h2>
                    <p class="text-red-500 font-bold">${product.price.toFixed(2)} MT</p>
                `;
                grid.appendChild(link);
            });
        }

        // Filtrar produtos
        function filterProducts(category = 'all', search = '') {
            let filtered = products;
            
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            
            if (search) {
                const searchTerm = search.toLowerCase();
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.description.toLowerCase().includes(searchTerm)
                );
            }
            
            renderProducts(filtered);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            filterProducts();
            
            // Eventos dos filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-red-500', 'text-white');
                    });
                    btn.classList.add('bg-red-500', 'text-white');
                    filterProducts(btn.dataset.category, document.getElementById('searchInput').value);
                });
            });
            
            // Evento de busca
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const activeFilter = document.querySelector('.filter-btn.bg-red-500');
                filterProducts(activeFilter?.dataset.category || 'all', e.target.value);
            });
        });
    </script>
</body>
</html>
