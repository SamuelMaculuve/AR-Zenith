<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 pb-24">
    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="p-4 flex items-center gap-3">
            <a href="javascript:history.back()" class="text-xl">←</a>
            <h1 class="font-semibold text-lg">My Cart</h1>
        </div>
    </header>

    <!-- CART ITEMS -->
    <div id="cartContainer" class="min-h-screen">
        <!-- Itens serão carregados aqui -->
    </div>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-md">
        <div class="flex justify-around py-3 text-xs text-gray-500">
            <a href="index.html" class="flex flex-col items-center">🏠 <span>Home</span></a>
            <a href="cart.html" class="flex flex-col items-center text-black font-semibold">
                🛒 <span>Cart</span>
            </a>
            <a href="#" class="flex flex-col items-center">👤 <span>Profile</span></a>
        </div>
    </nav>

    <script>
        // Mesmas funções do checkout para gerenciar o carrinho
        function loadCart() {
            return JSON.parse(localStorage.getItem('cart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function updateQuantity(productId, change) {
            const cart = loadCart();
            const itemIndex = cart.findIndex(item => item.id === productId);
            
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                
                saveCart(cart);
                renderCart();
            }
        }

        function removeItem(productId) {
            const cart = loadCart().filter(item => item.id !== productId);
            saveCart(cart);
            renderCart();
        }

        function calculateTotals() {
            const cart = loadCart();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const delivery = 50.00;
            const total = subtotal + delivery;
            
            return { subtotal, delivery, total };
        }

        function renderCart() {
            const cart = loadCart();
            const container = document.getElementById('cartContainer');
            const totals = calculateTotals();
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-500 text-lg">Your cart is empty</p>
                        <a href="index.html" class="mt-4 inline-block bg-black text-white px-6 py-3 rounded-full font-semibold">
                            Continue Shopping
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="p-4">
                    ${cart.map(item => `
                        <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
                            <div class="flex gap-4">
                                <img src="${item.image}" class="h-24 w-24 object-contain bg-gray-100 rounded-lg">
                                <div class="flex-1">
                                    <h3 class="font-semibold">${item.name}</h3>
                                    <p class="text-red-500 font-bold">${item.price.toFixed(2)} MT</p>
                                    <div class="flex justify-between items-center mt-3">
                                        <div class="flex items-center border rounded-lg">
                                            <button class="decrease-btn px-3 py-1 text-gray-500" data-id="${item.id}">−</button>
                                            <span class="px-3">${item.quantity}</span>
                                            <button class="increase-btn px-3 py-1 text-gray-500" data-id="${item.id}">+</button>
                                        </div>
                                        <button class="remove-btn text-red-500 text-sm" data-id="${item.id}">Remove</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                    
                    <div class="bg-white rounded-xl shadow-sm p-4 mt-4">
                        <div class="flex justify-between text-sm mb-2">
                            <span>Subtotal</span>
                            <span>${totals.subtotal.toFixed(2)} MT</span>
                        </div>
                        <div class="flex justify-between text-sm mb-2">
                            <span>Delivery</span>
                            <span>${totals.delivery.toFixed(2)} MT</span>
                        </div>
                        <div class="border-t mt-3 pt-3 flex justify-between font-semibold">
                            <span>Total</span>
                            <span class="text-red-500">${totals.total.toFixed(2)} MT</span>
                        </div>
                        <a href="checkout.html" class="block w-full bg-black text-white text-center py-3 rounded-xl font-semibold mt-4">
                            Proceed to Checkout
                        </a>
                    </div>
                </div>
            `;
            
            // Adicionar eventos
            container.querySelectorAll('.increase-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    updateQuantity(parseInt(e.target.dataset.id), 1);
                });
            });
            
            container.querySelectorAll('.decrease-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    updateQuantity(parseInt(e.target.dataset.id), -1);
                });
            });
            
            container.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm('Remove this item from cart?')) {
                        removeItem(parseInt(e.target.dataset.id));
                    }
                });
            });
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
